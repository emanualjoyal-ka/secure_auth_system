openapi: 3.0.3

info:
  title: Secure Auth API
  version: 1.0.0
  description: API documentation for Secure Authentication System

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/auth/register:
    $ref: "./paths/auth.yaml#/register"
  /api/auth/login:
    $ref: "./paths/auth.yaml#/login"
  /api/auth/me:
    $ref: "./paths/auth.yaml#/profile"
  /api/auth/change-password:
    $ref: "./paths/auth.yaml#/change-password"
  /api/auth/get-sessions:
    $ref: "./paths/auth.yaml#/getSessions"
  /api/auth/refresh:
    $ref: "./paths/auth.yaml#/refresh"
  /api/auth/logout:
    $ref: "./paths/auth.yaml#/logout"
  /api/auth/logout-device/{sessionId}:
    $ref: "./paths/auth.yaml#/logout-from-device"
  /api/auth/logout-all-devices:
    $ref: "./paths/auth.yaml#/logout-all-devices"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token stored in an HttpOnly cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Refresh token stored in an HttpOnly cookie.
