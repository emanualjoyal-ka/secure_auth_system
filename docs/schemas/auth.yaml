RegisterRequest:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
      example: John
    email:
      type: string
      format: email
      example: john@example.com
    password:
      type: string
      format: password
      example: StrongPassword123!

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: john@example.com
    password:
      type: string
      format: password
      example: StrongPassword123!

